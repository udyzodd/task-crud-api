<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuzzy Search Users</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        padding: 30px;
    }

    .container {
        max-width: 1100px;
        margin: auto;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    #search {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        margin-bottom: 25px;
        border: 1px solid #ccc;
        border-radius: 8px;
    }

    .card-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 20px;
    }

    .card {
        background: white;
        padding: 20px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        transition: transform 0.2s ease;
    }

    .card:hover {
        transform: translateY(-5px);
    }

    .card img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 12px;
    }

    .card h2 {
        margin-bottom: 10px;
        font-size: 1.2rem;
    }

    .card p {
        color: #666;
        line-height: 1.5;
    }
</style>

<body>

    <div class="container">
        <h1>User Directory</h1>

        <input type="text" id="search" placeholder="Search users...">

        <div id="card-container" class="card-container"></div>
    </div>

    <script>
        const users = [
            {
                name: "Alice Johnson",
                image: "https://i.pravatar.cc/150?img=1",
                bio: "Frontend developer who loves React and UI design."
            },
            {
                name: "Michael Brown",
                image: "https://i.pravatar.cc/150?img=2",
                bio: "Backend engineer passionate about Node.js and APIs."
            },
            {
                name: "Sophia Davis",
                image: "https://i.pravatar.cc/150?img=3",
                bio: "Graphic designer and digital illustrator."
            },
            {
                name: "Daniel Wilson",
                image: "https://i.pravatar.cc/150?img=4",
                bio: "Data analyst who enjoys working with large datasets."
            },
            {
                name: "Emma Taylor",
                image: "https://i.pravatar.cc/150?img=5",
                bio: "Content writer and SEO specialist."
            },
            {
                name: "James Anderson",
                image: "https://i.pravatar.cc/150?img=6",
                bio: "Mobile app developer focused on Android."
            },
            {
                name: "Olivia Martinez",
                image: "https://i.pravatar.cc/150?img=7",
                bio: "UX researcher interested in user behavior."
            },
            {
                name: "William Thomas",
                image: "https://i.pravatar.cc/150?img=8",
                bio: "Cloud engineer working with AWS services."
            }
        ];

        let inp = document.getElementById('search');
        let cardContainer = document.getElementById('card-container');

        // on input in the search field
        inp.addEventListener('input', function (event) {
            let value = event.target.value.toLowerCase();
            cardContainer.innerHTML = '';
            for (let i = 0; i < users.length; i++) {
                if (users[i].name.toLowerCase().includes(value.toLowerCase())) {
                    // display relevant cards

                    let card = document.createElement('div');
                    card.classList.add('card');

                    card.innerHTML = `
            <img src="${users[i].image}" alt="${users[i].name}">
            <h2>${users[i].name}</h2>
            <p>${users[i].bio}</p>
        `;

                    cardContainer.appendChild(card);
                }
            }
        });

    </script>

</body>

</html>
